<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Particle Todo</title>
    <style>
        :root {
            --primary: #6366f1;
            --glass: rgba(255, 255, 255, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f172a; /* Dark background to make particles pop */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* The Animation Layer */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none; /* Let clicks pass through to the app */
        }

        .app-wrapper {
            position: relative;
            z-index: 10; /* Above the canvas */
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 90%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h1 { margin: 0; color: #1e293b; font-size: 1.8rem; }
        .progress-container { background: #e2e8f0; height: 8px; border-radius: 10px; margin: 15px 0 5px; overflow: hidden; }
        .progress-bar { background: var(--primary); width: 0%; height: 100%; transition: width 0.5s ease; }
        #stats-text { font-size: 0.85rem; color: #64748b; margin-bottom: 25px; display: block; }

        .input-section { display: flex; gap: 10px; margin-bottom: 25px; }
        input { flex: 1; padding: 12px 16px; border: 2px solid transparent; border-radius: 12px; outline: none; font-size: 1rem; }
        input:focus { border-color: var(--primary); }

        button#add-btn {
            background: var(--primary); color: white; border: none; padding: 0 20px;
            border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        button#add-btn:hover { transform: scale(1.05); background: #4f46e5; }

        ul { list-style: none; padding: 0; margin: 0; }
        li {
            background: white; margin-bottom: 12px; padding: 12px 16px; border-radius: 14px;
            display: flex; align-items: center; justify-content: space-between;
            animation: slideIn 0.4s ease forwards;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .completed .text { text-decoration: line-through; color: #94a3b8; }
        .delete-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1.2rem; }
        .delete-btn:hover { color: #ef4444; }
        .empty-state { text-align: center; padding: 20px; color: #64748b; }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="app-wrapper">
        <div class="header">
            <h1>Focus</h1>
            <div class="progress-container">
                <div class="progress-bar" id="progress"></div>
            </div>
            <span id="stats-text">0/0 completed</span>
        </div>

        <div class="input-section">
            <input type="text" id="todo-input" placeholder="Add a goal..." autocomplete="off">
            <button id="add-btn">Add</button>
        </div>

        <div id="empty-state" class="empty-state">✨ Relax. You're all done.</div>
        <ul id="todo-list"></ul>
    </div>

    <script>
        /** PARTICLE SYSTEM LOGIC **/
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        const mouse = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', (event) => {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1;
                this.speedX = (Math.random() * 1.5) - 0.75;
                this.speedY = (Math.random() * 1.5) - 0.75;
            }

            draw() {
                ctx.fillStyle = 'rgba(99, 102, 241, 0.8)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }

            update() {
                // Movement
                this.x += this.speedX;
                this.y += this.speedY;

                // Screen Wrap
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;

                // Mouse Interaction
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < mouse.radius) {
                    const forceDirectionX = dx / distance;
                    const forceDirectionY = dy / distance;
                    const force = (mouse.radius - distance) / mouse.radius;
                    const directionX = forceDirectionX * force * this.density;
                    const directionY = forceDirectionY * force * this.density;
                    
                    this.x -= directionX;
                    this.y -= directionY;
                }
            }
        }

        function initParticles() {
            particlesArray = [];
            const numberOfParticles = (canvas.width * canvas.height) / 9000;
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function connectParticles() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 100) {
                        ctx.strokeStyle = `rgba(99, 102, 241, ${1 - distance/100})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            connectParticles();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animate();

        /** TODO APPLICATION LOGIC **/
        const input = document.getElementById('todo-input');
        const addBtn = document.getElementById('add-btn');
        const todoList = document.getElementById('todo-list');
        const progressBar = document.getElementById('progress');
        const statsText = document.getElementById('stats-text');
        const emptyState = document.getElementById('empty-state');

        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        function render() {
            todoList.innerHTML = '';
            tasks.forEach(task => {
                const li = document.createElement('li');
                if (task.completed) li.classList.add('completed');
                li.innerHTML = `
                    <span class="text" style="flex:1; cursor:pointer">${task.text}</span>
                    <button class="delete-btn">✕</button>
                `;
                li.querySelector('.text').onclick = () => {
                    task.completed = !task.completed;
                    saveAndRender();
                };
                li.querySelector('.delete-btn').onclick = () => {
                    tasks = tasks.filter(t => t.id !== task.id);
                    saveAndRender();
                };
                todoList.appendChild(li);
            });

            const completed = tasks.filter(t => t.completed).length;
            const percent = tasks.length === 0 ? 0 : (completed / tasks.length) * 100;
            progressBar.style.width = percent + '%';
            statsText.innerText = `${completed}/${tasks.length} tasks completed`;
            emptyState.style.display = tasks.length === 0 ? 'block' : 'none';
        }

        function saveAndRender() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            render();
        }

        addBtn.onclick = () => {
            if (!input.value.trim()) return;
            tasks.push({ id: Date.now(), text: input.value, completed: false });
            input.value = '';
            saveAndRender();
        };

        input.onkeypress = (e) => { if (e.key === 'Enter') addBtn.onclick(); };
        render();
    </script>
</body>
</html>
